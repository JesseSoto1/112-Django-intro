{% extends 'base.html' %}

{% block title %}
    Delete Post 
{% endblock %}

{% block content %}
    <h1>Delete Post {{ post.id }}</h1>
    <p>Are you sure you want to delete post<strong>"{{ post.title }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Confirm" class="btn btn-danger">
    </form>
    <a href="{% url 'post_detail' post.id %}" class="btn btn-secondary">Cancel</a>
    {% endblock %}
